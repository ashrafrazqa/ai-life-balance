<body>
    <div id="app">
        <!-- Main content area -->

            <!-- Views will be dynamically injected here -->

        <!-- AI Coach quick access -->
        <a href="#coach" class="coach-fab" id="coach-fab" aria-label="Buka AI Coach" title="AI Coach">

        <!-- Bottom Navigation -->
        
<template id="tpl-settings">
        <div class="view settings-view pb-safe">
            <header class="top-header">
                <div class="user-info">
                    <h2>Pengaturan</h2>
                    <p>Kelola profil dan koneksi Gemini AI.</p>
                </div>
            </header>

            <div class="card settings-card">
                <h3>Profil</h3>
                <div class="form-grid">
                    <label>
                        Nama
                        <input id="settings-name" type="text" autocomplete="name">
                    </label>
                    <label>
                        Umur
                        <input id="settings-age" type="number" min="1" max="120">
                    </label>
                    <label>
                        Jenis Kelamin
                        <select id="settings-gender">
                            <option value="">Pilih</option>
                            <option value="male">Pria</option>
                            <option value="female">Wanita</option>
                        </select>
                    </label>
                    <label>
                        Tinggi Badan (cm)
                        <input id="settings-height" type="number" min="50" max="250">
                    </label>
                    <label>
                        Berat Badan (kg)
                        <input id="settings-weight" type="number" min="10" max="300" step="0.1">
                    </label>
                    <label>
                        Target Berat (kg)
                        <input id="settings-target-weight" type="number" min="10" max="300" step="0.1">
                    </label>
                    <label>Tujuan
                        <select id="settings-goal"><option value="lose">Menurunkan berat badan</option><option value="maintain">Mempertahankan berat badan</option><option value="fitness">Meningkatkan kebugaran</option></select>
                    </label>
                    <label>Aktivitas harian
                        <select id="settings-activity"><option value="1.2">Jarang</option><option value="1.375">Ringan</option><option value="1.55">Sedang</option><option value="1.725">Tinggi</option><option value="1.9">Sangat tinggi</option></select>
                    </label>
                </div>
                <button id="settings-save" class="btn-primary w-100 mt-4" type="button"><span class="material-symbols-rounded">save</span> Simpan Pengaturan</button>
            </div>

            
            <div class="card settings-card theme-card">
                <div class="settings-section-title">
                    <span class="material-symbols-rounded">palette</span>
                    <div>
                        <h3>Tampilan</h3>
                        <p>Pilih tampilan yang paling nyaman untuk kamu.</p>
                    </div>
                </div>
                <div class="theme-options" id="theme-selector" role="group" aria-label="Pilihan tampilan">
                    <button type="button" class="theme-option" data-theme="light">
                        <span class="material-symbols-rounded">light_mode</span>
                        <span>Terang</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="dark">
                        <span class="material-symbols-rounded">dark_mode</span>
                        <span>Gelap</span>
                    </button>
                </div>
            </div>
<div class="card settings-card ai-service-card">
                <div class="settings-section-title">
                    <span class="material-symbols-rounded">auto_awesome</span>
                    <div>
                        <h3>AI Engine</h3>
                        <p class="settings-help">AI Life Balance menggunakan Gemini melalui server aplikasi. API Key dikelola secara aman dan tidak perlu dimasukkan oleh pengguna.</p>
                    </div>
                </div>
                <div class="ai-service-status">
                    <span class="status-dot"></span>
                    <div>
                        <strong>AI siap digunakan</strong>
                        <small>Gemini API Key disimpan sebagai konfigurasi server dan tidak ditampilkan di perangkat pengguna.</small>
                    </div>
                </div>
                <div id="settings-api-status" class="api-status" role="status" aria-live="polite"></div>
            </div>

        </div>
    </template>

<template id="tpl-about">
        <div class="view about-view pb-safe">
            <div class="about-hero">
                <div class="about-logo"><span class="material-symbols-rounded">restaurant</span></div>
                <div class="about-kicker">AI FOR EVERYDAY LIFE</div>
                <h1>AI Life Balance</h1>
                <p class="about-tagline">Eat Better. Move Better. Live Better.</p>
            </div>
            <div class="about-card">
                <div class="about-label">DEVELOPED BY</div>
                <h2>Ashraf Razqa Setiawardhana</h2>
                <div class="about-school">
                    <span class="material-symbols-rounded">school</span>
                    <div><strong>SMA Muhammadiyah 3 Jakarta</strong><span>Class X-5</span></div>
                </div>
            </div>
            <div class="about-card about-project">
                <div class="about-label">ABOUT THIS PROJECT</div>
                <p>AI Life Balance adalah asisten kesehatan berbasis Artificial Intelligence yang membantu pengguna memahami hubungan antara makanan, aktivitas, kebutuhan energi, dan tujuan berat badan agar dapat membuat pilihan yang lebih baik setiap hari.</p>
            </div>
            <div class="about-card qna-card">
                <div class="about-label">EDUKASI</div>
                <div class="qna-title"><span class="material-symbols-rounded">school</span><div><h2>Pahami Tubuhmu</h2><p>Jawaban singkat untuk memahami dasar pola hidup seimbang.</p></div></div>
                <div class="qna-list">
                    <details><summary>Apa itu kalori?</summary><p>Kalori adalah satuan energi. Tubuh menggunakan energi dari makanan dan minuman untuk menjalankan fungsi tubuh dan aktivitas sehari-hari.</p></details>
                    <details><summary>Kenapa tubuh membutuhkan kalori?</summary><p>Tubuh membutuhkan energi untuk bernapas, bergerak, berpikir, menjaga suhu tubuh, dan menjalankan berbagai fungsi tubuh.</p></details>
                    <details><summary>Apa itu TDEE?</summary><p>TDEE adalah perkiraan total energi yang digunakan tubuh dalam satu hari, termasuk energi untuk fungsi tubuh dan aktivitas.</p></details>
                    <details><summary>Apa itu defisit kalori?</summary><p>Defisit kalori terjadi ketika energi yang masuk lebih rendah daripada energi yang digunakan tubuh. Besarnya perlu disesuaikan dengan kondisi dan tujuan masing-masing.</p></details>
                    <details><summary>Apakah semakin sedikit makan semakin cepat turun berat badan?</summary><p>Tidak selalu. Tubuh tetap membutuhkan energi dan nutrisi yang cukup. Fokusnya adalah pola makan yang seimbang dan konsisten.</p></details>
                    <details><summary>Kenapa aktivitas fisik penting?</summary><p>Aktivitas fisik membantu menggunakan energi, menjaga kebugaran, dan mendukung kebiasaan hidup yang sehat.</p></details>
                    <details><summary>Apakah semua makanan harus dihindari saat ingin menurunkan berat badan?</summary><p>Tidak. Yang lebih penting adalah jumlah, frekuensi, kualitas makanan, dan keseimbangan pola makan secara keseluruhan.</p></details>
                    <details><summary>Kenapa berat aktual perlu dicatat?</summary><p>Karena hasil nyata bisa berbeda dari prediksi. Berat aktual membantu pengguna melihat perkembangan yang benar-benar terjadi dan menyesuaikan perjalanan berikutnya.</p></details>
                    <details><summary>Kenapa makanan dan aktivitas perlu dilihat bersama?</summary><p>Karena keseimbangan energi dipengaruhi oleh keduanya. Melihat keduanya bersama membantu pengguna memahami kebiasaan hariannya dengan lebih utuh.</p></details>
                    <details><summary>Kapan saya sebaiknya bertanya kepada AI Coach?</summary><p>Gunakan AI Coach ketika kamu ingin bertanya secara personal tentang makanan, aktivitas, target, kebiasaan, atau progress berdasarkan data yang sudah kamu catat.</p></details>
                </div>
            </div>
            <div class="about-footer"><span>AI • Food • Activity • Balance</span><small>© 2026 AI Life Balance</small></div>
        </div>
    </template>

<nav class="bottom-nav" id="bottom-nav" style="display: none;">
            <a href="#dashboard" class="nav-item active" data-target="dashboard"><span class="material-symbols-rounded">dashboard</span><span>Beranda</span></a>
            <a href="#food" class="nav-item" data-target="food"><span class="material-symbols-rounded">restaurant_menu</span><span>Makanan</span></a>

        </nav>
    </div>

    <!-- Templates for different views -->
    
    <!-- 1. Onboarding / Profile View -->
    <template id="tpl-onboarding">
        <div class="view onboarding-view">
            <div class="header-glass">
                <h1>Selamat Datang</h1>
                <p>Kenali tubuhmu, tetapkan tujuan, dan biarkan AI membantu menjaga keseimbangan harianmu.</p>
            </div>
            
            <form id="profile-form" class="card form-card">
                <div class="form-grid">
                    <label>Nama<input id="prof-name" type="text" autocomplete="name" placeholder="Nama kamu" required></label>
                    <label>Umur<input id="prof-age" type="number" min="5" max="120" placeholder="Contoh: 15" required></label>
                    <label>Jenis Kelamin<select id="prof-gender" required><option value="">Pilih</option><option value="male">Pria</option><option value="female">Wanita</option></select></label>
                    <label>Tinggi Badan (cm)<input id="prof-height" type="number" min="50" max="250" step="0.1" placeholder="Contoh: 170" required></label>
                    <label>Berat Saat Ini (kg)<input id="prof-weight" type="number" min="10" max="300" step="0.1" placeholder="Contoh: 63" required></label>
                    <label>Target Berat (kg)<input id="prof-target" type="number" min="10" max="300" step="0.1" placeholder="Contoh: 59" required></label>
                </div>
                <label class="full-field">Tujuan
                    <select id="prof-goal" required><option value="">Pilih tujuan</option><option value="lose">Menurunkan berat badan</option><option value="maintain">Mempertahankan berat badan</option><option value="fitness">Meningkatkan kebugaran</option></select>
                </label>
                <label class="full-field">Aktivitas harian
                    <select id="prof-activity" required><option value="">Pilih tingkat aktivitas</option><option value="1.2">Jarang</option><option value="1.375">Ringan</option><option value="1.55">Sedang</option><option value="1.725">Tinggi</option><option value="1.9">Sangat tinggi</option></select>
                </label>
                <button type="submit" class="btn-primary mt-2 w-100"><span class="material-symbols-rounded">arrow_forward</span> Mulai Perjalanan</button>
            </form>
        </div>
    </template>

    <!-- 2. Starting Point View -->
    <template id="tpl-starting-point">
        <div class="view starting-point-view pb-safe">
            <div class="starting-hero">
                <div class="starting-icon"><span class="material-symbols-rounded">auto_awesome</span></div>
                <span class="eyebrow">STARTING POINT</span>
                <h1>Kenali kondisi awalmu</h1>
                <p>AI Life Balance membaca data awalmu dan menjelaskan titik awal perjalananmu secara sederhana.</p>
            </div>
            <div class="card starting-stats" id="starting-stats">
                <div class="starting-stat"><small>Berat saat ini</small><strong id="start-weight">-</strong></div>
                <div class="starting-stat"><small>Perkiraan kebutuhan energi</small><strong id="start-tdee">-</strong><span class="stat-helper">TDEE = kebutuhan energi harian</span></div>
                <div class="starting-stat"><small>Target harian</small><strong id="start-target">-</strong></div>
                <div class="starting-stat"><small>Target berat</small><strong id="start-goal-weight">-</strong></div>
            </div>
            <div class="card starting-story">
                <div class="card-header"><span class="material-symbols-rounded icon-sparkle">auto_awesome</span><h3>Gambaran kondisimu</h3><span class="ai-live-badge">AI</span></div>
                <div id="starting-ai-loading" class="starting-ai-loading" role="status" aria-live="polite"><span class="loading-spinner-ring"></span><div><strong>AI sedang menyiapkan gambaranmu…</strong><small>Menganalisis data awal</small></div></div><p id="starting-insight" style="display:none">AI sedang membaca kondisi awalmu...</p>
            </div>
            <div class="card education-card compact-story">
                <div class="card-header"><span class="material-symbols-rounded">lightbulb</span><h3>Kenapa keseimbangan penting?</h3></div>
                <p>Setiap hari tubuh menerima energi dari makanan dan minuman, lalu menggunakan energi melalui metabolisme dan aktivitas. AI Life Balance membantu melihat hubungan keduanya, bukan hanya menghitung makanan.</p>
            </div>
            <button id="btn-start-journey" class="btn-primary w-100" type="button" disabled><span class="material-symbols-rounded">flag</span> Mulai Perjalanan Saya</button>
        </div>
    </template>

    <!-- 3. Dashboard View -->
    <template id="tpl-dashboard">
        <div class="view dashboard-view pb-safe">
            <header class="top-header dashboard-header">
                <div class="user-info">
                    <h2>Halo, <span id="dash-name">Pengguna</span></h2>
                    <p id="dash-story-subtitle">Mari lihat cerita keseimbanganmu hari ini.</p>
                </div>
                <div class="health-score balance-ring-wrap">
                    <svg viewBox="0 0 36 36" class="circular-chart green balance-ring">
                        <path class="circle-bg"
                            d="M18 2.0845
                            a 15.9155 15.9155 0 0 1 0 31.831
                            a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                        <path class="circle"
                            stroke-dasharray="0, 100"
                            id="score-circle"
                            d="M18 2.0845
                            a 15.9155 15.9155 0 0 1 0 31.831
                            a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                        <text x="18" y="20.35" class="percentage" id="dash-score">—</text>
                    </svg>
                    <small>Balance Score</small><span id="balance-score-note" class="score-note">Indikator keseimbangan harian</span>
                </div>
            </header>

            <section class="card summary-card glass-card">
                <h3>Energy Balance Hari Ini</h3>
                <div class="cal-display">
                    <div class="cal-item">
                        <span class="material-symbols-rounded">restaurant</span>
                        <div class="cal-val" id="dash-cal-in">0</div>
                        <small>Masuk</small>
                    </div>
                    <div class="cal-main">
                        <div class="cal-circle">
                            <span id="dash-cal-left" class="main-val">2000</span>
                            <small>Sisa Target</small>
                        </div>
                    </div>
                    <div class="cal-item">
                        <span class="material-symbols-rounded">local_fire_department</span>
                        <div class="cal-val" id="dash-cal-out">0</div>
                        <small>Terbakar</small>
                    </div>
                </div>

                <div class="energy-balance-visual" aria-label="Perbandingan energi masuk dan terbakar">
                    <div class="energy-balance-row">
                        <span><i class="energy-dot dot-in"></i> Masuk</span>
                        <div class="energy-track"><span id="energy-in-fill" class="energy-fill energy-fill-in"></span></div>
                        <strong id="energy-in-ratio">0%</strong>
                    </div>
                    <div class="energy-balance-row">
                        <span><i class="energy-dot dot-out"></i> Terbakar</span>
                        <div class="energy-track"><span id="energy-out-fill" class="energy-fill energy-fill-out"></span></div>
                        <strong id="energy-out-ratio">0%</strong>
                    </div>
                    <div class="energy-net-label"><span>⚖️ Keseimbangan energi</span><strong id="energy-net-value">0 kkal net</strong></div>
                </div>
                
                <div class="macros mt-4">
                    <div class="macro-item">
                        <span>Protein</span>
                        <div class="progress-bar"><div id="bar-p" class="fill bg-blue" style="width: 0%"></div></div>
                        <small id="txt-p">0g</small>
                    </div>
                    <div class="macro-item">
                        <span>Karbo</span>
                        <div class="progress-bar"><div id="bar-c" class="fill bg-green" style="width: 0%"></div></div>
                        <small id="txt-c">0g</small>
                    </div>
                    <div class="macro-item">
                        <span>Lemak</span>
                        <div class="progress-bar"><div id="bar-f" class="fill bg-orange" style="width: 0%"></div></div>
                        <small id="txt-f">0g</small>
                    </div>
                </div>
            </section>

            <section class="card dashboard-mini-stats glass-card">
                <div class="dashboard-mini-grid">
                    <div><small>Berat saat ini</small><strong id="dash-w-current">-</strong></div>
                    <div><small>Target berat</small><strong id="dash-w-target">-</strong></div>
                    <div><small>Kebutuhan energi</small><strong id="dash-tdee">-</strong></div>
                    <div><small>Target harian</small><strong id="dash-target-cal">-</strong></div>
                </div>
            </section>



            <section class="card dashboard-progress-card glass-card">
                <div class="card-header"><span class="material-symbols-rounded">monitoring</span><h3>Progress 7 Hari</h3></div>
                <div id="dashboard-progress-chart" class="progress-chart" aria-label="Grafik makanan dan aktivitas 7 hari"></div>
                <div class="chart-legend"><span><i class="legend-in"></i> Makanan</span><span><i class="legend-out"></i> Aktivitas</span></div>
            </section>

            <section class="card dashboard-story-card glass-card">
                <div class="card-header"><span class="material-symbols-rounded">auto_awesome</span><h3>Cerita Hari Ini</h3></div>
                <p id="dashboard-story-text" class="text-sm">AI akan membantu menceritakan keseimbangan harimu setelah ada catatan makanan atau aktivitas.</p>
                <a class="story-more-link" href="#progress"><span>Baca perjalananmu</span><span class="material-symbols-rounded">arrow_forward</span></a>
            </section>

            <section class="card daily-target-card glass-card">
                <div class="card-header"><span class="material-symbols-rounded">calculate</span><h3>Rumus Target Harian</h3></div>
                <div class="daily-target-equation"><strong id="formula-tdee">TDEE</strong><span>−</span><strong id="formula-deficit">Defisit</strong><span>=</span><strong id="formula-target">Target kkal</strong></div><div class="formula-meaning"><span><b>A</b> = kebutuhan energi harian</span><span><b>B</b> = pengurangan sesuai tujuan</span><span><b>C</b> = target kalori harian</span></div>
                <p id="formula-caption">Contoh: TDEE 2.000 − defisit 500 = target 1.500 kkal/hari.</p>
            </section>
        </div>
    </template>
    
    <!-- 3. Progress View -->
    <template id="tpl-progress">
        <div class="view progress-view pb-safe">
            <header class="top-header page-header-stacked">
                <span class="eyebrow">PERJALANANMU</span>
                <h2>Progress</h2>
                <p>Lihat perubahanmu dari waktu ke waktu, bukan hanya angka hari ini.</p>
            </header>
            <div class="progress-stat-grid">
                <div class="card progress-stat-card"><small>Berat saat ini</small><strong id="progress-w-current">-</strong></div>
                <div class="card progress-stat-card"><small>Target berat</small><strong id="progress-w-target">-</strong></div>
                <div class="card progress-stat-card"><small>Prediksi target</small><strong id="progress-prediction" class="prediction-date">-</strong></div>
            </div>
            <section class="card progress-story-card glass-card">
                <div class="card-header"><span class="material-symbols-rounded">auto_awesome</span><h3>Cerita Perjalanan</h3></div>
                <p id="progress-journey-story" class="text-sm">Perjalananmu akan terlihat lebih jelas setelah beberapa hari mencatat makanan, aktivitas, dan berat aktual.</p>
                <p class="text-xs progress-story-hint">Check-in berat secara berkala untuk melihat cerita perjalanan yang benar-benar sesuai dengan perubahanmu.</p>
            </section>
            <section class="card progress-card glass-card">
                <div class="card-header"><span class="material-symbols-rounded">scale</span><h3>Check-in Berat Aktual</h3></div>
                <p class="text-sm">Berat aktual membantu aplikasi membandingkan prediksi dengan perjalanan yang benar-benar terjadi.</p>
                <div class="input-group progress-checkin"><input id="progress-weight-checkin" type="number" step="0.1" min="10" max="300"><span>kg</span><button id="progress-weight-checkin-btn" class="btn-primary" type="button">Simpan</button></div>
            </section>
            <section class="card progress-card glass-card">
                <div class="card-header"><span class="material-symbols-rounded">trending_down</span><h3>Berat Aktual dari Waktu ke Waktu</h3></div>
                <div id="progress-weight-history-chart" class="weight-history-chart"></div>
                <p id="progress-weight-story" class="text-sm mt-3"></p>
            </section>
        </div>
    </template>

    <!-- 3. Food / Meal Planner View -->
    <template id="tpl-food">
        <div class="view food-view pb-safe">
            <header class="top-header">
                <h2>Catatan Makanan</h2>
            </header>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="diary">Hari Ini</button>
                <button class="tab-btn" data-tab="history">Riwayat</button>
                <button class="tab-btn" data-tab="planner">AI Planner</button>
            </div>
            
            <div id="tab-diary" class="tab-content active">
                <div class="food-list" id="food-list">
                    <p class="empty-state">Belum ada makanan yang dicatat hari ini.</p>
                </div>
            </div>
            <div id="tab-history" class="tab-content" style="display:none;">
                <div class="history-summary" id="food-history-summary"></div>
                <div class="history-list" id="food-history-list"></div>
            </div>
            
            <div id="tab-planner" class="tab-content" style="display:none;">
                <div class="card glass-card">
                    <div class="card-header">
                        <span class="material-symbols-rounded icon-sparkle">auto_awesome</span>
                        <h3>Smart Meal Plan</h3>
                    </div>
                    <p class="text-sm mb-4">Rekomendasi menu hari ini untuk mencapai target kalori.</p>
                    
                    <div class="meal-plan" id="meal-plan-container">
                        <!-- AI Meal plan generated here -->
                    </div>
                </div>
                <div class="card glass-card mt-4">
                    <div class="card-header">
                        <span class="material-symbols-rounded">kitchen</span>
                        <h3>Smart Pantry</h3>
                    </div>
                    <p class="text-sm mb-2">Punya bahan sisa? Masukkan ke sini agar AI buatkan menu.</p>
                    <div class="input-group">
                        <input type="text" id="pantry-input" placeholder="Cth: telur, ayam, tahu">
                        <button type="button" class="btn-secondary mt-2" id="btn-pantry"><span class="material-symbols-rounded">auto_awesome</span> Buat Menu</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 4. Scanner View -->
    <template id="tpl-scan">
        <div class="view scan-view pb-safe">
            <header class="top-header page-header-stacked">
                <span class="eyebrow">AI FOOD SCANNER</span>
                <h2>Scan Makanan</h2>
                <p>Ambil foto atau ketik makanan. AI akan membantu memperkirakan kalori dan nutrisinya.</p>
            </header>
            
            <div class="scanner-container card">
                <div class="camera-wrapper" id="camera-wrapper">
                    <video id="camera-stream" autoplay playsinline></video>
                    <canvas id="camera-canvas" style="display:none;"></canvas>
                    <div class="camera-overlay">
                        <div class="capture-btn-container">
                            <button id="btn-capture" class="btn-capture" type="button" aria-label="Ambil foto makanan" title="Ambil foto makanan"></button>
                        </div>
                    </div>
                </div>
                <div class="camera-error" id="camera-error" style="display:none; text-align:center; padding:2rem 0;">
                    <span class="material-symbols-rounded text-primary" style="font-size:3rem;">no_photography</span>
                    <p class="mt-2 text-sm">Akses kamera tidak diizinkan atau tidak tersedia.</p>
                </div>
                
                <div class="scan-result" id="scan-result" style="display:none;">
                    <div class="scan-loading" id="scan-loading">
                        <span class="material-symbols-rounded spin">sync</span>
                        <p>AI sedang menganalisis...</p>
                    </div>
                    <div class="scan-details" id="scan-details" style="display:none;">
                        <input type="text" id="res-food-name" class="editable-title" value="Mengenali...">
                        <div class="res-cal">
                            <input type="number" id="res-food-cal" class="editable-num" value="0"> Kkal
                        </div>
                        <div class="res-macros mt-2">
                            <span><input type="number" id="res-p" class="editable-sm" value="0">g Protein</span>
                            <span><input type="number" id="res-c" class="editable-sm" value="0">g Karbo</span>
                            <span><input type="number" id="res-f" class="editable-sm" value="0">g Lemak</span>
                        </div>
                        <button class="btn-primary w-100 mt-4" id="btn-save-food">Simpan ke Diary</button>
                        <button class="btn-text w-100 mt-2" id="btn-cancel-food">Batal</button>
                    </div>
                </div>
                
                <div class="manual-entry mt-4 text-center">
                    <p class="text-sm">Atau ketik manual (Contoh: "1 mangkok soto ayam"):</p>
                    <div class="input-group manual-scan-group">
                        <input type="text" id="manual-food-input" placeholder="Contoh: 1 piring nasi goreng ayam">
                        <button class="btn-secondary mt-2" id="btn-manual-food"><span class="material-symbols-rounded">auto_awesome</span> Analisis dengan AI</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 5. Activity View -->
    <template id="tpl-activity">
        <div class="view activity-view pb-safe">
            <header class="top-header">
                <h2>Aktivitas Hari Ini</h2>
            </header>
            
            <div class="card glass-card">
                <div class="card-header">
                    <span class="material-symbols-rounded icon-sparkle">auto_awesome</span>
                    <h3>Catat Aktivitas dengan AI</h3>
                </div>
                <p class="text-sm mb-2">Ketik aktivitas dan durasinya, misalnya “jalan cepat 45 menit”. AI akan memperkirakan kalori yang terbakar berdasarkan jenis aktivitas, durasi, intensitas, dan berat badanmu.</p>
                <div class="chat-input-wrapper">
                    <input type="text" id="act-input" placeholder="Cth: Hari ini saya lari 30 menit">
                    <button id="btn-save-act" class="btn-icon"><span class="material-symbols-rounded">send</span></button>
                </div>
            </div>
            
            <div class="tabs activity-tabs mt-4">
                <button class="tab-btn active" data-activity-tab="today">Hari Ini</button>
                <button class="tab-btn" data-activity-tab="history">Riwayat</button>
            </div>
            <div id="activity-today-panel">
                <h3 class="mt-2 mb-2">Aktivitas Hari Ini</h3>
                <div class="activity-list" id="activity-list">
                    <p class="empty-state">Belum ada aktivitas.</p>
                </div>
            </div>
            <div id="activity-history-panel" style="display:none;">
                <div class="history-summary" id="activity-history-summary"></div>
                <div class="history-list" id="activity-history-list"></div>
            </div>
        </div>
    </template>

    <!-- 6. AI Coach View -->
    <template id="tpl-coach">
        <div class="view coach-view pb-safe">
            <header class="top-header coach-header">
                <div class="coach-avatar">
                    <span class="material-symbols-rounded">smart_toy</span>
                </div>
                <div>
                    <h2>AI Life Coach</h2>
                    <p>Tanya apa saja tentang pola hidup sehat dan keseimbangan harianmu</p>
                </div>
                <button id="btn-clear-chat" class="btn-text" style="margin-left:auto; color:var(--text-muted); font-size:0.8rem; display:flex; align-items:center; gap:4px;" title="Hapus Riwayat Chat">
                    <span class="material-symbols-rounded" style="font-size:1.2rem;">delete_sweep</span>
                </button>
            </header>
            
            <div class="chat-container" id="chat-container">
                <div class="chat-msg coach-msg">
                    <div class="msg-bubble">Halo! Saya adalah AI Coach personal kamu. Ada yang ingin ditanyakan atau butuh motivasi hari ini?</div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Tanya tentang makanan, aktivitas, kebiasaan, target, atau progress...">
                <button id="btn-send-chat" class="btn-icon btn-primary"><span class="material-symbols-rounded">send</span></button>
            </div>
        </div>
    </template>

    <div id="app-alert" class="app-alert" role="dialog" aria-live="polite" aria-modal="true" style="display:none;">
        <div class="app-alert-card">
            <div class="app-alert-icon" id="app-alert-icon"><span class="material-symbols-rounded">info</span></div>
            <div class="app-alert-body"><h3 id="app-alert-title">Pengingat</h3><p id="app-alert-message"></p></div>
            <button id="app-alert-close" class="app-alert-close" type="button" aria-label="Tutup"><span class="material-symbols-rounded">close</span></button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
